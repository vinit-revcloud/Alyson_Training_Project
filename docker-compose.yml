# Production-like local run — requires .env.production with real Neon/AWS values.
# Usage:
#   cp .env.example .env.production   # fill in production values
#   docker compose up --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_NEON_AUTH_URL: ${VITE_NEON_AUTH_URL}
        VITE_NEON_DATA_API_URL: ${VITE_NEON_DATA_API_URL}
    ports:
      - "4173:4173"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 4173
      HOST: 0.0.0.0
    volumes:
      - alyson-storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4173/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  alyson-storage:
