name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (Vercel preset)
        env:
          VERCEL: "1"
          VITE_NEON_AUTH_URL: https://placeholder.neonauth.example/auth
          VITE_NEON_DATA_API_URL: https://placeholder.apirest.example/rest/v1
        run: npm run build

      - name: Verify Vercel output
        run: test -f .vercel/output/functions/__server.func/index.mjs
